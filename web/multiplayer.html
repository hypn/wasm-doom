<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odamex Web Deathmatch</title>
<link rel="stylesheet" href="odamex-web.css">
<style>
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: #161616; color: var(--fg); font: inherit; font-size: 16px; }
  input:focus { outline: none; border-color: var(--accent); }
  button { padding: 10px 18px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: 700 1rem Impact, "Arial Narrow", sans-serif; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>

<div class="overlay" id="join">
  <div class="panel">
    <h1>Deathmatch</h1>
    <p>Shareware DOOM deathmatch, rotating through Knee-Deep in the Dead (E1M1–E1M9).</p>
    <form id="joinform">
      <input id="name" maxlength="15" placeholder="Player name" autocomplete="off" autofocus required>
      <button type="submit">Play</button>
    </form>
    <p>Click the game to capture the mouse. Esc opens the menu, T to chat, hold Tab for scores, M for the map.</p>
  </div>
</div>

<div class="overlay" id="loading" hidden>
  <div class="panel">
    <h1>Loading</h1>
    <div class="bar"><div id="progress"></div></div>
    <p id="status"></p>
  </div>
</div>

<div class="overlay" id="error" hidden>
  <div class="panel">
    <h1>Error</h1>
    <pre id="errortext"></pre>
    <p><a href="" onclick="location.reload(); return false">Reload</a></p>
  </div>
</div>

<script src="odamex.js"></script>
<script src="odamex-web.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  // The bridge relays every client to its odasrv, whatever address is used here.
  var SERVER = '127.0.0.1:10666';

  function show(id) {
    ['join', 'loading', 'error'].forEach(function (o) { $(o).hidden = o !== id; });
  }
  function fail(msg) {
    $('errortext').textContent = String(msg);
    show('error');
    try { document.exitPointerLock(); } catch (e) {}
  }
  // Printable ASCII without quotes or semicolons, which would break the
  // console command line, and no leading +/-, which would start a new option.
  function sanitize(name) {
    return name.replace(/[^\x21-\x7e ]|["';\\]/g, '').replace(/^[\s+-]+/, '').trim().slice(0, 15);
  }

  try { $('name').value = localStorage.getItem('odamex_name') || ''; } catch (e) {}

  $('joinform').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = sanitize($('name').value);
    if (!name) { $('name').value = ''; $('name').focus(); return; }
    try { localStorage.setItem('odamex_name', name); } catch (e) {}

    show('loading');
    OdamexWeb.boot({
      canvas: $('canvas'),
      iwad: 'DOOM1.WAD',
      websocketUrl: (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws',
      args: ['+set', 'cl_name', name, '+connect', SERVER],
      onFatal: fail,
      onStatus: function (text, fraction) {
        $('status').textContent = text;
        $('progress').style.width = (fraction * 100) + '%';
        if (fraction >= 1) show(null);
      },
    }).catch(function (e) { fail(e && e.stack || e); });
  });
})();
</script>
</body>
</html>
