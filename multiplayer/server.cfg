// Odamex Web deathmatch server: shareware DOOM, rotating through E1M1-E1M9.
// Started by run.sh (dist/run.sh).

set sv_hostname "Odamex Web Deathmatch"
set sv_motd "Hello from Hypn :)"

// Local only: browsers reach the server through the bridge (bridge.js).
set sv_usemasters "0"
set sv_upnp "0"

// Security: these are Odamex's defaults, set here so that they stay that way.
// No remote admin: with no password, RCON logins always fail.
set rcon_password ""
// No cheats (god mode, noclip, give, kill): the server enforces this, so a
// modified client can't get around it.
set sv_allowcheats "0"
// No player votes (kick, map changes, limits, restarts).
set sv_callvote_kick "0"
set sv_callvote_forcespec "0"
set sv_callvote_forcestart "0"
set sv_callvote_map "0"
set sv_callvote_nextmap "0"
set sv_callvote_randmap "0"
set sv_callvote_randcaps "0"
set sv_callvote_randpickup "0"
set sv_callvote_restart "0"
set sv_callvote_fraglimit "0"
set sv_callvote_scorelimit "0"
set sv_callvote_timelimit "0"
set sv_callvote_lives "0"
set sv_callvote_coinflip "0"
// Chat flood protection: at most one message per 1.5 seconds per player.
set sv_flooddelay "1.5"

// Deathmatch: first to 30 frags or 10 minutes, then the next map.
set sv_gametype "1"
set sv_fraglimit "30"
set sv_timelimit "10"
set sv_intermissionlimit "10"
set sv_maxclients "16"
set sv_maxplayers "16"
set sv_skill "5"
set sv_nomonsters "1"
set sv_allowexit "0"
set sv_itemsrespawn "1"
set sv_weaponstay "1"
set sv_emptyreset "1"

clearmaplist
addmap E1M1
addmap E1M2
addmap E1M3
addmap E1M4
addmap E1M5
addmap E1M6
addmap E1M7
addmap E1M8
addmap E1M9
